<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Band Bots" />
    <meta name="theme-color" content="#465638" />
    <meta name="description" content="A shared workspace where people and persistent AI teammates get work done together." />

      try {
        document.documentElement.dataset.theme = localStorage.getItem("band-slack.theme.v1") === "dark" ? "dark" : "light";

        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Band Bots · Your team, working together</title>
